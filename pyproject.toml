[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-pruning-kit"
version = "0.1.0"
description = "Magnitude-pruning toolkit with per-layer survival reporting, sparse masks, and lottery-ticket reproduction helpers."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muhtasim-Munif-Fahim"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
prune-kit = "prune_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]